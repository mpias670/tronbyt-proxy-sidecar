services:
  sidecar:
    build: .
    # Or, use the published image: image: ghcr.io/mpias670/tronbyt-proxy-sidecar:latest
    container_name: tronbyt-sidecar-dev
    restart: unless-stopped
    env_file: .env
    ports:
      # HOST_PORT is the port on your machine; the container always listens
      # on PORT internally (default 8080, matching the sidecar's own
      # default). If you hit "address already in use", just change
      # HOST_PORT in your .env -- no need to edit this file.
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    # Reaps zombie grandchild processes left behind by Chromium if it's ever
    # killed mid-render. The sidecar also self-reaps as PID 1 (see
    # reap_linux.go), so this is a defense-in-depth belt-and-suspenders
    # measure, not strictly required.
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Chromium is launched on demand and torn down immediately after solving
    # a challenge, so steady-state memory is a few MB; this cap only exists
    # to bound the rare worst case (MAX_CONCURRENT_BROWSERS x one Chromium
    # process) rather than to size for continuous browser usage.
    deploy:
      resources:
        limits:
          memory: 512M

  # Example: tronbyt-server on the same network, so the surflive-proxy app
  # can reach the sidecar at http://sidecar:8080. Remove this if you already
  # run tronbyt-server elsewhere and just want the sidecar.
  # tronbyt-server:
  #   image: ghcr.io/tronbyt/server:latest
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - sidecar
